services:
  postgres:
    image: postgres:16-alpine
    container_name: rag-postgres
    environment:
      POSTGRES_DB: chainlit
      POSTGRES_USER: chainlit
      POSTGRES_PASSWORD: chainlit
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chainlit -d chainlit"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Host port is configurable so the stack can run next to an existing
      # Postgres/Qdrant (set POSTGRES_PORT/QDRANT_PORT in .env). The in-container
      # ports never change, so service DNS below stays valid either way.
      - "${POSTGRES_PORT:-5432}:5432"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag-qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    # Without this, dependents can only wait for `service_started`, which is the
    # container existing rather than Qdrant answering. `make check` then probed a
    # port nothing was listening on yet and reported the index unreachable -- the
    # same symptom #23 fixed, for a different reason and harder to spot, since it
    # depends on whether the AI-service checks ahead of it happen to take longer
    # than Qdrant's ~0.8s startup.
    #
    # Spelled with bash's /dev/tcp because the image ships no curl, wget or nc.
    # CMD, not CMD-SHELL: that form runs /bin/sh, which here is dash, and /dev/tcp
    # is a bash builtin -- the check then fails every time with "Directory
    # nonexistent" and the service never leaves `starting`.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/6333 &&
          printf 'GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '200 OK' <&3
      interval: 5s
      timeout: 3s
      # Generous: a cold start is ~1s here, but a loaded machine or a large
      # collection replaying its WAL is the case this exists for.
      retries: 12
      start_period: 5s

  chainlit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-chainlit
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      ingest:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      # Deliberately NOT ${DATABASE_URL}: .env holds the value for running the
      # app on the host (localhost:5432), which inside a container points at the
      # container itself. Compose interpolates from that same .env, so reusing the
      # name would break the Docker path. Use DOCKER_DATABASE_URL for an external DB.
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://chainlit:chainlit@postgres:5432/chainlit}
      CHAINLIT_AUTH_SECRET: ${CHAINLIT_AUTH_SECRET:-change-me}
      CHAINLIT_AUTH_USERNAME: ${CHAINLIT_AUTH_USERNAME:-admin}
      CHAINLIT_AUTH_PASSWORD: ${CHAINLIT_AUTH_PASSWORD:-admin}
      CHAINLIT_INIT_DB: ${CHAINLIT_INIT_DB:-true}
      # Deliberately NOT ${CHAT_DB_PATH}: .env holds the value for running the app on
      # the host, which is fine there but points at the bind-mounted ./.chainlit
      # inside a container. This database is SQLite in WAL mode, which needs a
      # shared-memory file and real POSIX locking, and Docker Desktop only emulates
      # both across the host filesystem boundary, so a write interrupted at the wrong
      # moment corrupts it ("database disk image is malformed"). The chat_db volume
      # below is a real Linux filesystem. An existing history moves over once on
      # startup.
      #
      # Set DOCKER_CHAT_DB_PATH to override, e.g. on Linux, where a bind mount is an
      # ordinary filesystem and keeping the file on the host makes it easy to back up.
      CHAT_DB_PATH: ${DOCKER_CHAT_DB_PATH:-/app/.chatdb/chat_history.sqlite3}
      # Watch the document folders and index changes automatically. Defaults to on,
      # so an .env from before this feature needs no editing; set it to false to
      # turn it off.
      DOCUMENT_WATCH: ${DOCUMENT_WATCH:-true}
      DOCUMENT_WATCH_INTERVAL: ${DOCUMENT_WATCH_INTERVAL:-5}
      DOCUMENT_WATCH_SETTLE: ${DOCUMENT_WATCH_SETTLE:-5}
      # RAG instance config (must match the ingest service).
      RAG_CONFIG: ${RAG_CONFIG:-examples/papers/rag.config.yaml}
      # IMPORTANT: inside Docker network, use service DNS name (not localhost)
      QDRANT_URL: http://qdrant:6333
      # Answer scoring. Empty means "leave the YAML alone", so this is off unless
      # you either set EVALUATION_ENABLED=true or turn it on in rag.config.yaml.
      # The eval service itself always runs; this is the only switch.
      EVALUATION_ENABLED: ${EVALUATION_ENABLED:-}
      EVALUATION_SERVICE_URL: ${EVALUATION_SERVICE_URL:-http://eval:8001}
      EVALUATION_JUDGE_MODEL: ${EVALUATION_JUDGE_MODEL:-}
    volumes:
      # Documents (and generated figures) live under ./data/documents, which is
      # already covered by the `.:/app` mount below.
      - .:/app
      - ./.chainlit:/app/.chainlit
      - ./.files:/app/.files
      # Docling's PDF models (~500 MB) cache under /root/.cache/docling and
      # /root/.cache/huggingface. Without this volume every rebuild, and every
      # `run --rm ingest`, downloads them again.
      - model_cache:/root/.cache
      # SQLite must not live on the bind mount above; see CHAT_DB_PATH.
      - chat_db:/app/.chatdb
    ports:
      - "${APP_PORT:-8000}:8000"

  ingest:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-ingest
    depends_on:
      qdrant:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # RAG instance config (must match the chainlit service).
      RAG_CONFIG: ${RAG_CONFIG:-examples/papers/rag.config.yaml}
      # IMPORTANT: inside Docker network, use service DNS name (not localhost)
      QDRANT_URL: http://qdrant:6333
      # Pass through ONLY if explicitly set. A default here would win over the
      # YAML (env beats config by design), silently redirecting every other
      # RAG_CONFIG into this collection / embedding model.
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-}
      LITELLM_BASE_URL: ${LITELLM_BASE_URL}
      LITELLM_API_KEY: ${LITELLM_API_KEY}
      EMBED_MODEL: ${EMBED_MODEL:-}
      INGEST_RECREATE: ${INGEST_RECREATE:-false}
      INGEST_BATCH_SIZE: ${INGEST_BATCH_SIZE:-256}
      INGEST_MAX_BATCH_CHARS: ${INGEST_MAX_BATCH_CHARS:-20000}
    volumes:
      - .:/app
      # Same model cache as the chainlit service. This is the container that
      # actually reads PDFs, and it runs with --rm, so without a volume it
      # re-downloads Docling's models on every single ingest run.
      - model_cache:/root/.cache
    command:
      - /bin/sh
      - -lc
      - |
        echo "Waiting for Qdrant at $$QDRANT_URL ...";
        python - <<'PY'
        import os
        import sys
        import time
        import urllib.request

        base = (os.environ.get("QDRANT_URL") or "http://qdrant:6333").rstrip("/")
        url = f"{base}/collections"

        for i in range(60):
            try:
                with urllib.request.urlopen(url, timeout=2) as resp:
                    if 200 <= resp.status < 500:
                        print(f"Qdrant is reachable: {url} (status={resp.status})")
                        sys.exit(0)
            except Exception:
                pass
            time.sleep(2)

        print(f"Qdrant did not become ready in time: {url}", file=sys.stderr)
        sys.exit(1)
        PY
        python -m kb.ingest --config "$$RAG_CONFIG" \
          $$( [ "$$INGEST_RECREATE" = "true" ] && echo "--recreate" );
    restart: "no"

  # Answer-quality scoring and the evaluation dashboard on :8001.
  #
  # Starts with everything else, deliberately. `evaluation.enabled` in the YAML (or
  # EVALUATION_ENABLED) is the switch, and while it is false this container idles: the
  # app imports nothing, posts nothing and renders nothing, so no judge calls happen
  # and nothing is billed.
  #
  # It used to sit behind a `profiles: ["eval"]` to avoid building ragas for people
  # who never score anything. That traded a 744 MB build — against the 1.6 GB the app
  # and ingest images cost anyway — for a second command nobody remembers. The
  # documented upgrade path is `docker compose up -d --build`, which skipped a
  # profiled service silently, so this container sat running pre-merge code for six
  # days while the rest of the stack moved on. One switch, in the config, where the
  # rest of this template's switches live.
  #
  # It stays a separate service: the metric library has no business in the Chainlit
  # image, and a judge call must never sit between the user and their answer. Nothing
  # depends_on it, so if it is down the app just records no scores and says nothing.
  eval:
    build:
      context: .
      dockerfile: eval_app/Dockerfile
    container_name: rag-eval
    env_file:
      - .env
    environment:
      # Same gateway and credentials the app and ingest use — judge calls are
      # ordinary LiteLLM calls.
      LITELLM_BASE_URL: ${LITELLM_BASE_URL}
      LITELLM_API_KEY: ${LITELLM_API_KEY}
      EVAL_DB_PATH: ${DOCKER_EVAL_DB_PATH:-/app/.evaldb/eval.sqlite3}
    volumes:
      # A named volume, not a bind mount: this is SQLite in WAL mode and needs real
      # POSIX locking, exactly as described for chat_db above.
      - eval_db:/app/.evaldb
    # No published port on purpose: the browser never talks to this service. The
    # app proxies everything it needs (/eval-status, /eval-stats, /eval-gold) over
    # the compose network, behind its own login. The raw dashboard and API still
    # exist inside the network — uncomment to expose them for debugging:
    # ports:
    #   - "${EVAL_PORT:-8001}:8001"

volumes:
  postgres_data:
  qdrant_data:
  model_cache:
  chat_db:
  eval_db:
