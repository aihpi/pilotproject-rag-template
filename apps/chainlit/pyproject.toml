[project]
name = "rag-chainlit"
version = "0.1.0"
description = "Config-driven Chainlit RAG app (LiteLLM + Qdrant + Docling)"
requires-python = ">=3.12"
dependencies = [
    "chainlit==2.11.0",
    "asyncpg>=0.29.0",
    "litellm>=1.75.8",
    "qdrant-client>=1.14.1",
    "python-dotenv>=1.0.1",
    "docling>=2.118.0",  # below this, docling-parse leaks ligatures as glyph names (see CHANGELOG)
    "bcrypt>=4.1.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    # Transitive via docling, but declared directly so [tool.uv.sources] below can pin
    # them to the CPU wheel index — uv only honours sources for direct dependencies.
    # Ranges mirror docling's own (torch<3,>=2.2.2 / torchvision<1,>=0).
    "torch>=2.2.2,<3",
    "torchvision<1",
    # Stands in for rapidocr's opencv-python (see the override in [tool.uv] below).
    "opencv-python-headless>=4.5.1.48",
    # Filesystem events for the document watcher. Already present via chainlit,
    # declared here because document_watch.py imports it directly.
    "watchfiles>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
    "mkdocs-static-i18n>=1.2",
]
# The eval service only. Install with `uv sync --only-group eval`, which omits the
# app's own dependencies — the whole point of running scoring in its own container
# is to keep this chain out of the Chainlit image (see eval_app/main.py). RAGAS
# drags in langchain and datasets, which is exactly the weight that must not land
# in the app image.
#
# Pinned exactly. 0.4.3 has been the newest release since 2026-01-13 with no commits
# since February, and it deprecates its own `ragas.metrics` import path in favour of
# a v1.0 that has not shipped, so a range would be a bet on an unmaintained
# resolution. eval_app/metrics.py imports from `ragas.metrics.collections`, the
# non-deprecated path.
#
# DeepEval was tried first and could not score against a self-hosted gateway at all
# (see the note in eval_app/metrics.py). openai is declared because RAGAS is driven
# through an AsyncOpenAI client rather than litellm.
eval = [
    "ragas==0.4.3",
    # ragas 0.4.3 does `from langchain_community.chat_models.vertexai import
    # ChatVertexAI` at import time, and langchain-community removed that module in
    # 0.4.2 — so `import ragas` raises ModuleNotFoundError on anything newer. ragas
    # has had no commits since February, so this will not be fixed upstream and the
    # ceiling has to live here. Found the hard way: the resolver picked 0.4.2 for the
    # container while a local venv happened to hold 0.4.1, so it worked locally and
    # died in Docker.
    "langchain-community<0.4.2",
    "openai>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

# NOTE: both blocks below are uv-only. `pip install -e .` ignores them and installs the
# CUDA torch plus BOTH OpenCV wheels — which reintroduces the `import cv2` crash. Always
# install with `uv sync`.

# docling -> rapidocr hard-requires opencv-python, the GUI build, which dlopens
# libxcb/libGL at `import cv2` and dies on slim images. The headless wheel provides the
# same cv2 module with no X11 linkage. uv cannot rename a dependency, so a never-true
# marker drops rapidocr's requirement and the headless wheel declared in
# [project.dependencies] stands in — nothing has to be uninstalled after install.
[tool.uv]
override-dependencies = ["opencv-python; sys_platform == 'nonexistent'"]

# torch's default PyPI wheel bundles a CUDA runtime (~4.4 GB of nvidia-*/triton) that the
# container can never use: Docker Desktop exposes no CUDA device, and docling's
# layout/table models run fine on CPU. Resolving from the CPU index keeps that out of the
# lockfile, so Docker, CI and local dev all agree without a post-install swap.
# Linux only — macOS wheels on PyPI are already CPU/MPS and this index has no darwin build.
# On a CUDA host, drop these two blocks and re-run `uv lock` to get GPU acceleration back.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
