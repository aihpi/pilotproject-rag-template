# Mounts a Windows / SMB share as the document folder, read-only, at
# /data/documents inside the ingest and chainlit containers. Use it on top of
# the base file:
#
#   docker compose -f docker-compose.yml -f docker-compose.smb.yml up -d --build
#   (or: make up-smb)
#
# SMB_SHARE / SMB_USER / SMB_PASSWORD come from .env; see .env.example. Pair it
# with RAG_CONFIG=examples/smb/rag.config.yaml, whose data source points at
# /data/documents.
#
# The Docker host needs CIFS support: Docker Desktop ships it, a Linux VM needs
# `apt install cifs-utils`. If the volume driver refuses to mount, mount the
# share on the host (`mount.cifs //server/share /mnt/documents -o ro,...`) and
# replace the volume below with a bind mount `/mnt/documents:/data/documents:ro`.
services:
  ingest:
    volumes:
      - documents_smb:/data/documents:ro
  chainlit:
    volumes:
      - documents_smb:/data/documents:ro

volumes:
  documents_smb:
    driver: local
    driver_opts:
      type: cifs
      device: "${SMB_SHARE}"
      # ro twice on purpose: the mount is read-only even if the account is not.
      # SMB_PASSWORD must not contain a comma: Docker splits this string on
      # commas and mount.cifs' credentials= file is not available here. Pick a
      # comma-free password or use the bind-mount fallback described above.
      #
      # No vers=: client and server negotiate the highest dialect both support.
      # Measured against Samba 4.23 through this driver, an omitted vers= gets
      # 3.1.1 while vers=3.0 pins it to 3.0, so the old pin was strictly worse
      # against a server that can do better -- Windows Server 2025 does 3.1.1.
      # Omitting also keeps this file working against an older server, which a
      # hard 3.1.1 would refuse. There is no silent fall back to SMB 1.0: that
      # needs an explicit vers=1.0. Check what a live mount settled on with
      # `docker compose exec ingest mount | grep cifs`.
      o: "username=${SMB_USER},password=${SMB_PASSWORD},ro,iocharset=utf8"
